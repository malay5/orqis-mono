# Render blueprint for the orqis platform API.
#
# This one service currently does double duty: the platform API (auth,
# credits, catalogue, invocation proxy) AND all 40 in-house agent runtimes,
# because orqis-backend still contains a copy of them. That's why there is no
# separate orqis-owned-services deployment yet — see ARCHITECTURE.md
# ("Known duplication").
#
# Deploy: Render dashboard → New → Blueprint → point at this repo.
services:
  - type: web
    name: orqis-api
    runtime: node
    plan: starter # NOT free: the free tier sleeps after 15 min idle and the
                  # first request then takes ~50s. Every page read on the
                  # frontend goes through this service, so a cold start stalls
                  # the whole site, not just agent calls.
    region: singapore # closest to the primary audience; move if that changes
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      # Pinned explicitly so the loopback URL below can't drift. Render
      # injects 10000 by default, but relying on that default silently breaks
      # every in-house agent if it ever changes.
      - key: PORT
        value: 10000
      # Generated by Render on first deploy; used to sign login JWTs.
      - key: AUTH_SECRET
        generateValue: true
      # Set these in the dashboard — they are secrets or account-specific.
      - key: MONGODB_URI
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      # Public URL of this service. Used to build webhook URLs for async
      # agents and the /r/<id> artifact links.
      - key: PUBLIC_BASE_URL
        fromService:
          type: web
          name: orqis-api
          envVarKey: RENDER_EXTERNAL_URL
      # Where the in-house agents live. They're in THIS service today, so the
      # invocation proxy calls back into itself. Loopback rather than the
      # public URL keeps that hop off the internet — no DNS, no TLS, no
      # egress. Render sets PORT to 10000.
      - key: OWNED_SERVICES_BASE_URL
        value: http://127.0.0.1:10000
      # Browser origins allowed to call this API directly. The frontend goes
      # through its own route handlers, so this is a backstop.
      - key: CORS_ORIGINS
        sync: false
